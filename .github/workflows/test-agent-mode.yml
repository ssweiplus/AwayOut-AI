name: Agent Mode Tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install optional importer dependency
        run: python -m pip install pyyaml
      - name: Run Agent Mode tests
        run: python -m unittest discover -s skills/awayout-security/tests -p "test_*.py" -v

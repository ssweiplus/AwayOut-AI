name: Vendor pinned PyRIT templates

on:
  push:
    branches:
      - feat/pyrit-soft-guidance-elite-memory
    paths:
      - .github/workflows/vendor-pyrit.yml
      - skills/awayout-security/scripts/vendor_pyrit.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout AwayOut
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Checkout pinned PyRIT source
        uses: actions/checkout@v4
        with:
          repository: microsoft/PyRIT
          ref: 695255f6fe299ac7af2876d16fe946f2b7e0aa72
          path: _pyrit_upstream
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install build-only YAML parser
        run: python -m pip install pyyaml
      - name: Generate bundled catalog
        run: >-
          python skills/awayout-security/scripts/vendor_pyrit.py
          --source _pyrit_upstream
          --dest skills/awayout-security/resources/pyrit
      - name: Verify embedded catalog and API tests
        run: |
          python -m unittest discover -s skills/awayout-security/tests -p "test_*.py" -v
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("skills/awayout-security/resources/pyrit")
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          assert manifest["total_bundled"] == 151, manifest
          assert (root / "LICENSE").is_file()
          print("Bundled", manifest["total_bundled"], "PyRIT templates")
          PYTHONPATH=skills/awayout-security python - <<'EOF'
          from common.template_guidance import load_templates
          actual = load_templates(".awayout-agent")
          assert len(actual) == 151, len(actual)
          print("Runtime catalog OK:", len(actual))
          EOF
          PY
      - name: Commit embedded templates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills/awayout-security/resources/pyrit/
          if ! git diff --cached --quiet; then
            git commit -m "vendor: embed pinned PyRIT templates and license"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "Templates are already up to date"
          fi
